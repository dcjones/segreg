[project]
name = "segreg"
version = "0.1.0"
description = "Cell segmentation aware regression and metrics for spatial transcriptomics"
readme = "README.md"
authors = [
    { name = "Daniel C. Jones", email = "djones3@fredhutch.org" }
]
requires-python = ">=3.13"
dependencies = [
    "anndata>=0.13.2",
    "patsy>=1.0.2",
    "scipy>=1.18.0",
    "spatialdata>=0.8.0",
    "torch>=2.13.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
